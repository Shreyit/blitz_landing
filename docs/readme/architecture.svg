<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">BLITZ system architecture</title>
  <desc id="desc">Next.js handles uploads and sessions, and calls Supabase PostgreSQL functions for auction commands. PostgreSQL saves a safe public snapshot and email jobs. A Supabase Edge Function delivers mail through a provider; Realtime notifies spectators of changes.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.label{font-size:22px;font-weight:700;fill:#202820}.small{font-size:15px;fill:#6B7468}
    .flow{stroke-dasharray:8 16;animation:travel 3s linear infinite}
    @keyframes travel{to{stroke-dashoffset:-96}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="488" rx="24" fill="#F7F8F2" stroke="#DDE4D5"/>
  <text x="40" y="48" fill="#315A36" font-size="12" font-weight="700" letter-spacing="3">THE SYSTEM / SEPARATE RESPONSIBILITIES</text>
  <g fill="none" stroke="#BCCCB1" stroke-width="2"><path d="M330 162H470 M330 204H470 M730 183H870 M1000 257V351H730 M470 386H330"/></g>
  <g fill="none" stroke="#315A36" stroke-width="2" class="flow"><path d="M330 162H470 M470 204H330 M730 183H870 M1000 257V351H730 M470 386H330"/></g>
  <g fill="#315A36"><path d="M461 157L470 162L461 167Z M339 199L330 204L339 209Z M861 178L870 183L861 188Z M739 346L730 351L739 356Z M339 381L330 386L339 391Z"/></g>
  <text x="369" y="147" class="small">HTTP / RPC</text><text x="352" y="233" class="small">Command result</text><text x="754" y="166" class="small">Transactions</text><text x="1020" y="311" class="small">Mail jobs</text><text x="362" y="372" class="small">Delivery</text>
  <g>
    <rect x="40" y="91" width="290" height="166" rx="16" fill="white" stroke="#DDE4D5"/>
    <rect x="62" y="113" width="40" height="31" rx="5" fill="none" stroke="#315A36" stroke-width="2"/><path d="M62 122H102" stroke="#315A36" stroke-width="2"/><circle cx="69" cy="118" r="1.5" fill="#315A36"/>
    <text x="62" y="182" class="label">Browser / Next.js</text><text x="62" y="211" class="small">Pages, forms, admin controls</text><text x="62" y="235" class="small">Uploads + sessions + live notices</text>
    <rect x="470" y="91" width="260" height="166" rx="16" fill="#315A36"/>
    <path d="M500 113H518L507 128H519L495 150L502 134H492Z" fill="#D9F46B"/>
    <text x="492" y="182" font-size="22" font-weight="700" fill="#F7F8F2">Database functions</text><text x="492" y="211" font-size="15" fill="#D8E5CE">Validation + auction authority</text><text x="492" y="235" font-size="15" fill="#D8E5CE">Locked transactions + safe state</text>
    <rect x="870" y="91" width="290" height="166" rx="16" fill="white" stroke="#DDE4D5"/>
    <g stroke="#315A36" fill="none" stroke-width="2"><path d="M893 119V140C893 149 925 149 925 140V119 M893 130C893 139 925 139 925 130"/><ellipse cx="909" cy="119" rx="16" ry="6"/></g>
    <text x="892" y="182" class="label">Supabase PostgreSQL</text><text x="892" y="211" class="small">Players, purses, bids, teams</text><text x="892" y="235" class="small">Assignments, audit, email outbox</text>
    <rect x="470" y="313" width="260" height="124" rx="16" fill="#EAF0DF" stroke="#DDE4D5"/>
    <circle cx="505" cy="343" r="11" stroke="#315A36" fill="none" stroke-width="2"/><path d="M505 335V343L511 347" stroke="#315A36" fill="none" stroke-width="2"/>
    <text x="492" y="383" class="label">Edge mail worker</text><text x="492" y="410" class="small">Leased jobs + retry backoff</text>
    <rect x="40" y="313" width="290" height="124" rx="16" fill="white" stroke="#DDE4D5"/>
    <rect x="62" y="331" width="34" height="23" rx="4" fill="none" stroke="#315A36" stroke-width="2"/><path d="M63 333L79 345L95 333" fill="none" stroke="#315A36" stroke-width="2"/>
    <text x="62" y="383" class="label">Email provider</text><text x="62" y="410" class="small">Verify email + team assignment</text>
  </g>
  <text x="870" y="413" fill="#315A36" font-size="14">Realtime: notify, then read state.</text><text x="870" y="435" fill="#6B7468" font-size="14">Supabase Auth + private Storage.</text>
</svg>
