<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">BLITZ backend architecture</title>
  <desc id="desc">The browser talks only to one Next.js API route on Vercel. The route uses Supabase Auth for organiser login, a private Storage bucket for photos, and PostgreSQL database functions for every change. Each auction change rebuilds a public snapshot and sends a Realtime ping so screens re-read it. New email jobs wake an Edge Function that sends through Gmail SMTP.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:3px;fill:#315A36}
    .h{font-size:19px;font-weight:700;fill:#202820}
    .hw{font-size:19px;font-weight:700;fill:#F7F8F2}
    .s{font-size:14px;fill:#6B7468}
    .sw{font-size:14px;fill:#D8E5CE}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#202820}
    .mp{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#C9693D}
    .lab{font-size:13px;fill:#315A36;font-weight:700}
    .rail{fill:none;stroke:#BCCCB1;stroke-width:2}
    .flow{fill:none;stroke:#315A36;stroke-width:2;stroke-dasharray:8 14;animation:travel 2.6s linear infinite}
    .flow.slow{animation-duration:4s}
    .dot{fill:#D9F46B;stroke:#315A36;stroke-width:2}
    @keyframes travel{to{stroke-dashoffset:-88}}
    @keyframes glow{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
    .glow{animation:glow 2.4s ease-in-out infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    
    @media(prefers-reduced-motion:reduce){.flow,.glow,.ring,.step,.on{animation:none}.dot{display:none}.on{opacity:0}.on0{opacity:1}}
  </style>
  <rect x="1" y="1" width="1198" height="538" rx="24" fill="#F7F8F2" stroke="#DDE4D5"/>
  <text x="40" y="48" class="k">THE SYSTEM / WHO DOES WHAT</text>
  <rect x="630" y="68" width="540" height="452" rx="22" fill="#EAF0DF" stroke="#DDE4D5"/>
  <text x="652" y="94" class="k">SUPABASE</text>
  <g class=""><rect x="40" y="110" width="240" height="220" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="60" y="142" class="h">Browser</text>
  <text x="60" y="166" class="s">Home · Register · Teams</text>
  <text x="60" y="187" class="s">Auction Dome (/auction)</text>
  <text x="60" y="208" class="s">Admin (/admin)</text>
  <text x="60" y="229" class="s">Auction controls</text>
  <text x="60" y="250" class="s">(/admin/auction)</text>
  </g>
  <g class=""><rect x="340" y="110" width="240" height="220" rx="16" fill="#315A36" stroke="none"/>
  <text x="360" y="142" class="hw">Vercel · Next.js</text>
  <text x="360" y="166" class="sw">Pages + one API route</text>
  <text x="360" y="187" class="sw">/api/…</text>
  <text x="360" y="208" class="sw">Validates every input</text>
  <text x="360" y="229" class="sw">Resizes photos to 600px</text>
  <text x="360" y="250" class="sw">Holds the server key</text>
  </g>
  <g class=""><rect x="650" y="110" width="240" height="60" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="670" y="142" class="h">Auth · organiser login</text>
  </g>
  <g class=""><rect x="650" y="185" width="240" height="60" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="670" y="217" class="h">Storage · private photos</text>
  </g>
  <g class=""><rect x="650" y="260" width="240" height="80" rx="16" fill="#315A36" stroke="none"/>
  <text x="670" y="292" class="hw">Database functions</text>
  <text x="670" y="316" class="sw">register · auction command</text>
  </g>
  <g class=""><rect x="910" y="110" width="240" height="135" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="930" y="142" class="h">PostgreSQL</text>
  <text x="930" y="166" class="s">schema blitz (private)</text>
  <text x="930" y="187" class="s">registrations · teams</text>
  <text x="930" y="208" class="s">auction · bids · assignments</text>
  <text x="930" y="229" class="s">audit · email outbox</text>
  </g>
  <g class=""><rect x="910" y="260" width="240" height="80" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="930" y="292" class="h">Public snapshot</text>
  <text x="930" y="316" class="s">one read-only JSON row</text>
  </g>
  <g class=""><rect x="910" y="355" width="240" height="70" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="930" y="387" class="h">Realtime ping</text>
  <text x="930" y="411" class="s">“version 42 changed”</text>
  </g>
  <g class=""><rect x="650" y="440" width="240" height="70" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="670" y="472" class="h">Edge mail worker</text>
  <text x="670" y="496" class="s">leases jobs, retries</text>
  </g>
  <g class=""><rect x="340" y="440" width="240" height="70" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="360" y="472" class="h">Gmail SMTP</text>
  <text x="360" y="496" class="s">sends designed emails</text>
  </g>
  <g class=""><rect x="40" y="440" width="240" height="70" rx="16" fill="white" stroke="#DDE4D5"/>
  <text x="60" y="472" class="h">Student inbox</text>
  <text x="60" y="496" class="s">receipt · sold to a team</text>
  </g>
  <path d="M280 160H340" class="rail"/>
  <path d="M280 160H340" class="flow"/>
  <path d="M331 155L340 160L331 165Z" fill="#315A36"/>
  <text x="286" y="150" class="lab">HTTPS</text>
  <circle r="6" class="dot"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M280 160H340"/></circle>
  <path d="M580 140H650" class="rail"/>
  <path d="M580 140H650" class="flow"/>
  <path d="M641 135L650 140L641 145Z" fill="#315A36"/>
  <text x="594" y="130" class="lab">login</text>
  <path d="M580 215H650" class="rail"/>
  <path d="M580 215H650" class="flow"/>
  <path d="M641 210L650 215L641 220Z" fill="#315A36"/>
  <text x="592" y="205" class="lab">photo</text>
  <path d="M580 300H650" class="rail"/>
  <path d="M580 300H650" class="flow"/>
  <path d="M641 295L650 300L641 305Z" fill="#315A36"/>
  <text x="600" y="290" class="lab">RPC</text>
  <circle r="6" class="dot"><animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite" path="M580 300H650"/></circle>
  <path d="M890 290H900V180H910" class="rail"/>
  <path d="M890 290H900V180H910" class="flow"/>
  <path d="M901 175L910 180L901 185Z" fill="#315A36"/>
  <path d="M890 310H910" class="rail"/>
  <path d="M890 310H910" class="flow"/>
  <path d="M901 305L910 310L901 315Z" fill="#315A36"/>
  <path d="M1030 340V355" class="rail"/>
  <path d="M1030 340V355" class="flow"/>
  <path d="M1025 346L1030 355L1035 346Z" fill="#315A36"/>
  <path d="M910 395H160V330" class="rail"/>
  <path d="M910 395H160V330" class="flow"/>
  <path d="M155 339L160 330L165 339Z" fill="#315A36"/>
  <text x="380" y="385" class="lab">notify, then re-read the snapshot</text>
  <circle r="6" class="dot"><animateMotion dur="3.2s" begin="1.2s" repeatCount="indefinite" path="M910 395H160V330"/></circle>
  <path d="M1150 180H1185V475H890" class="rail"/>
  <path d="M1150 180H1185V475H890" class="flow slow"/>
  <path d="M899 470L890 475L899 480Z" fill="#315A36"/>
  <text x="1000" y="466" class="lab">new email job</text>
  <circle r="6" class="dot"><animateMotion dur="3.6s" begin="0.4s" repeatCount="indefinite" path="M1150 180H1185V475H890"/></circle>
  <path d="M650 475H580" class="rail"/>
  <path d="M650 475H580" class="flow slow"/>
  <path d="M589 470L580 475L589 480Z" fill="#315A36"/>
  <path d="M340 475H280" class="rail"/>
  <path d="M340 475H280" class="flow slow"/>
  <path d="M289 470L280 475L289 480Z" fill="#315A36"/>

</svg>
