<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">BLITZ database schema</title>
  <desc id="desc">Private tables in the blitz schema: registrations, teams, the single auction row, bids, assignments, email outbox, organiser users and audit events, with their links. Private fields such as WhatsApp, age, gender and region are visible to organisers only. Spectators read only public.auction_public_state.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:3px;fill:#315A36}
    .h{font-size:19px;font-weight:700;fill:#202820}
    .hw{font-size:19px;font-weight:700;fill:#F7F8F2}
    .s{font-size:14px;fill:#6B7468}
    .sw{font-size:14px;fill:#D8E5CE}
    .m{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#202820}
    .mp{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#C9693D}
    .lab{font-size:13px;fill:#315A36;font-weight:700}
    .rail{fill:none;stroke:#BCCCB1;stroke-width:2}
    .flow{fill:none;stroke:#315A36;stroke-width:2;stroke-dasharray:8 14;animation:travel 2.6s linear infinite}
    .flow.slow{animation-duration:4s}
    .dot{fill:#D9F46B;stroke:#315A36;stroke-width:2}
    @keyframes travel{to{stroke-dashoffset:-88}}
    @keyframes glow{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
    .glow{animation:glow 2.4s ease-in-out infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    
    @media(prefers-reduced-motion:reduce){.flow,.glow,.ring,.step,.on{animation:none}.dot{display:none}.on{opacity:0}.on0{opacity:1}}
  </style>
  <rect x="1" y="1" width="1198" height="838" rx="24" fill="#F7F8F2" stroke="#DDE4D5"/>
  <text x="40" y="48" class="k">THE DATABASE / SCHEMA blitz</text>
  <text x="1160" y="48" font-size="13" fill="#C9693D" text-anchor="end">orange = private, organisers only</text>
  <path d="M360 150H395V330H430" class="rail"/>
  <path d="M360 150H395V330H430" class="flow"/>
  <path d="M421 325L430 330L421 335Z" fill="#315A36"/>
  <circle r="6" class="dot"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M360 150H395V330H430"/></circle>
  <path d="M360 300H380V530H800" class="rail"/>
  <path d="M360 300H380V530H800" class="flow"/>
  <path d="M791 525L800 530L791 535Z" fill="#315A36"/>
