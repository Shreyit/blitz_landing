<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">BLITZ six-team tournament format</title>
  <desc id="desc">Six teams split into Pool A and Pool B of three teams. Each pool plays a three-match round robin. The top team of each pool goes straight to the Final, and the Final winner is champion. There are no quarterfinals, semifinals or third-place match.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .k{font-size:12px;font-weight:700;letter-spacing:3px;fill:#315A36}
    .h{font-size:19px;font-weight:700;fill:#202820}
    .hw{font-size:19px;font-weight:700;fill:#F7F8F2}
    .s{font-size:14px;fill:#6B7468}
    .sw{font-size:14px;fill:#D8E5CE}
    .box{fill:#FFFFF9;stroke:#BCCCB1;stroke-width:1.5}
    .rail{fill:none;stroke:#BCCCB1;stroke-width:2}
    .flow{fill:none;stroke:#315A36;stroke-width:2;stroke-dasharray:8 14;animation:travel 2.6s linear infinite}
    .dot{fill:#D9F46B;stroke:#315A36;stroke-width:2}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes travel{to{stroke-dashoffset:-88}}
    @keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
    @media(prefers-reduced-motion:reduce){.flow,.ring{animation:none}.ring{opacity:0}.dot{display:none}}
  </style>
  <rect x="1" y="1" width="1198" height="468" rx="24" fill="#F7F8F2" stroke="#DDE4D5"/>
  <text x="40" y="48" class="k">TOURNAMENT / TWO POOLS, ONE FINAL</text>
  <path id="pa" d="M210 235H250V140H300" class="rail"/><path id="pb" d="M210 235H250V330H300" class="rail"/>
  <path id="fa" d="M660 140H720V235H770" class="rail"/><path id="fb" d="M660 330H720V235H770" class="rail"/>
  <path id="fc" d="M960 235H1000" class="rail"/>
  <path d="M210 235H250V140H300M210 235H250V330H300M660 140H720V235H770M660 330H720V235H770M960 235H1000" class="flow"/>
  <circle r="6" class="dot"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle>
  <circle r="6" class="dot"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion></circle>
  <circle r="6" class="dot"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#fa"/></animateMotion></circle>
  <circle r="6" class="dot"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#fb"/></animateMotion></circle>
  <rect x="40" y="185" width="170" height="100" rx="16" class="box"/>
  <text x="125" y="228" text-anchor="middle" class="h">6 teams</text><text x="125" y="252" text-anchor="middle" class="s">drawn into 2 pools</text>
  <rect x="300" y="85" width="360" height="110" rx="16" class="box"/>
  <text x="322" y="120" class="h">Pool A</text><text x="322" y="146" class="s">A1 vs A2 · A2 vs A3 · A3 vs A1</text><text x="322" y="172" class="s">Win 3 · Draw 1 where allowed · Loss 0</text>
  <rect x="300" y="275" width="360" height="110" rx="16" class="box"/>
  <text x="322" y="310" class="h">Pool B</text><text x="322" y="336" class="s">B1 vs B2 · B2 vs B3 · B3 vs B1</text><text x="322" y="362" class="s">Win 3 · Draw 1 where allowed · Loss 0</text>
  <text x="730" y="130" class="s">Top team</text><text x="730" y="360" class="s">Top team</text>
  <rect x="770" y="185" width="190" height="100" rx="16" fill="#315A36"/>
  <text x="865" y="228" text-anchor="middle" class="hw">Final</text><text x="865" y="252" text-anchor="middle" class="sw">Pool A vs Pool B winner</text>
  <rect x="1000" y="185" width="160" height="100" rx="16" fill="#D9F46B" stroke="#315A36" stroke-width="1.5"/>
  <rect x="1000" y="185" width="160" height="100" rx="16" fill="none" stroke="#315A36" stroke-width="2" class="ring"/>
  <text x="1080" y="242" text-anchor="middle" class="h">Champion</text>
  <text x="40" y="430" class="s">No quarterfinals, semifinals, byes or third-place match. Power lifting runs separately by weight category.</text>
</svg>
